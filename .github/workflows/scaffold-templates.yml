# Builds and tests the checked-in example for every bundled template, so a
# broken template cannot be merged. The template list is read from the CLI
# itself (`new --list-templates --json`) rather than hardcoded here, so a
# newly added template is covered automatically. examples-drift.yml checks
# that each checked-in project still matches its source template.
name: scaffold-templates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build soroban-forge
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.list.outputs.templates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build soroban-forge
        run: cargo build --release --bin soroban-forge
      - name: List bundled templates
        id: list
        # `new --list-templates --json` is the CLI's own catalogue (see
        # crates/scaffold/src/lib.rs::available_templates) — the matrix below
        # fans out over whatever it reports, never a list maintained here.
        run: |
          templates=$(./target/release/soroban-forge new --list-templates --json | jq -c '[.[].name]')
          echo "templates=$templates" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soroban-forge-bin
          path: target/release/soroban-forge
          retention-days: 1
  build-examples:
    name: "example: ${{ matrix.template }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.build.outputs.templates) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Key each contract example independently.
          key: ${{ matrix.template }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: soroban-forge-bin
          path: bin
      - name: Generate and run initialization guard test
        run: |
          chmod +x bin/soroban-forge
          test_dir=$(mktemp -d)
          cp -a "examples/${{ matrix.template }}/." "$test_dir/"
          rm -rf "$test_dir/tests"
          bin/soroban-forge test-init --path "$test_dir"
          if [[ -f "$test_dir/tests/forge_init_once.rs" ]]; then
            cargo +stable test --manifest-path "$test_dir/Cargo.toml" --test forge_init_once
          fi
      - name: cargo test
        working-directory: examples/${{ matrix.template }}
        run: cargo +stable test
      - name: Build contract WASM
        working-directory: examples/${{ matrix.template }}
        run: cargo +stable build --target wasm32v1-none --release
      - name: Verify setup entrypoint is one-time
        run: bash scripts/check-template-initializers.sh
